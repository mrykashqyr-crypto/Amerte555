<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>أميرتي — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a13;--surface:#0c1322;--surface2:#111b30;
  --border:rgba(34,211,238,0.15);--accent:#22d3ee;
  --green:#4ade80;--red:#f87171;--amber:#fbbf24;
  --text:#e2e8f0;--muted:#64748b;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(circle at 15% 10%,rgba(34,211,238,.1),transparent 40%),
  radial-gradient(circle at 85% 15%,rgba(16,185,129,.08),transparent 35%);}
.mono{font-family:'JetBrains Mono',monospace}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(6,10,19,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(16,185,129,.15));
  border:1px solid rgba(34,211,238,.3);display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-text{font-size:18px;font-weight:900;color:#fff}
.logo-text span{color:var(--accent)}
#statusPill{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;
  display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Main */
main{max-width:860px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:20px}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}
.card-title{font-size:14px;font-weight:800;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:16px;background:var(--accent);border-radius:2px;display:block}

/* Pairing Banner — أهم شي */
#pairingCard{display:none;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(34,211,238,.08));
  border-color:rgba(74,222,128,.4);text-align:center;padding:28px 20px}
#pairingCard.show{display:block}
.pair-label{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.05em;margin-bottom:12px}
.pair-code{font-family:'JetBrains Mono',monospace;font-size:clamp(28px,8vw,52px);font-weight:700;
  color:#fff;letter-spacing:.18em;background:rgba(0,0,0,.4);border:2px solid rgba(74,222,128,.4);
  border-radius:16px;padding:16px 24px;display:inline-block;margin:8px 0;text-shadow:0 0 30px rgba(74,222,128,.4)}
.pair-steps{font-size:12px;color:rgba(226,232,240,.7);line-height:1.8;margin-top:12px}
.pair-steps b{color:var(--accent)}
#pairTimer{font-size:13px;font-weight:700;color:var(--amber);margin-top:10px}

/* Controls */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:11px 16px;border-radius:12px;font-size:13px;font-weight:800;
  font-family:'Cairo',sans-serif;cursor:pointer;border:1px solid transparent;transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn-start{background:rgba(74,222,128,.15);color:var(--green);border-color:rgba(74,222,128,.35)}
.btn-start:hover{background:rgba(74,222,128,.25)}
.btn-stop{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.3)}
.btn-stop:hover{background:rgba(248,113,113,.22)}
.btn-restart{background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.3)}
.btn-restart:hover{background:rgba(251,191,36,.22)}
.btn-reset{background:var(--surface2);color:var(--muted);border-color:var(--border)}
.btn-reset:hover{color:var(--red);border-color:rgba(248,113,113,.3)}

/* Inputs */
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
input,select{width:100%;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.35);
  border:1px solid var(--border);color:var(--text);font-size:13px;font-family:'Cairo',sans-serif;outline:none}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}

/* Upload */
#dropZone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:.2s}
#dropZone:hover,#dropZone.over{border-color:var(--accent);background:rgba(34,211,238,.03)}
#dropZone p{color:var(--muted);font-size:13px;margin:6px 0}
.upload-btn{display:inline-block;margin-top:10px;padding:8px 20px;border-radius:10px;
  background:rgba(34,211,238,.15);color:var(--accent);border:1px solid rgba(34,211,238,.3);
  font-weight:700;font-size:12px;cursor:pointer}
#progWrap{display:none;margin-top:12px}
#progBar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
#progFill{height:100%;width:0%;background:var(--accent);transition:width .3s}
#progLbl{font-size:12px;color:var(--muted);margin-top:6px}

/* Files list */
#filesList{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border)}
.file-ext{font-size:10px;font-weight:700;color:var(--accent);font-family:monospace;
  background:rgba(34,211,238,.1);padding:2px 6px;border-radius:5px}
.file-name{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-del{font-size:11px;color:var(--muted);cursor:pointer;padding:3px 8px;border-radius:6px}
.file-del:hover{color:var(--red);background:rgba(248,113,113,.1)}

/* Terminal */
#termLogs{height:280px;overflow-y:auto;background:#020509;border-radius:12px;
  padding:14px;font-size:11.5px;line-height:1.75;font-family:'JetBrains Mono',monospace}
#termLogs .out{color:#cbd5e1}
#termLogs .err{color:var(--red)}
#termLogs .sys{color:var(--accent)}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:10px 22px;border-radius:999px;font-size:13px;font-weight:700;
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:999;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <div>
      <div class="logo-text">أميرتي <span>Panel</span></div>
      <div style="font-size:11px;color:var(--muted)">Gemini 2.0 Flash ⚡</div>
    </div>
  </div>
  <div id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusTxt">جاري الاتصال…</span>
  </div>
</header>

<main>

  <!-- كود الربط — يظهر تلقائياً -->
  <div class="card" id="pairingCard">
    <div class="pair-label">🔑 كود ربط واتساب — أدخله الآن</div>
    <div class="pair-code" id="pairCode">--------</div>
    <div class="pair-steps">
      افتح <b>واتساب</b> ← النقاط ⋮ ← <b>الأجهزة المرتبطة</b> ← <b>ربط جهاز</b> ← <b>ربط برقم الهاتف</b> ← أدخل الكود
    </div>
    <div id="pairTimer">⏱ ينتهي خلال <span id="pairSec">60</span> ثانية</div>
  </div>

  <!-- إعدادات + تحكم -->
  <div class="card">
    <div class="card-title">إدارة البوت</div>
    <div class="input-row">
      <div>
        <label>كلمة مرور الإدارة</label>
        <input id="adminPass" type="password" value="amirati2026"/>
      </div>
      <div>
        <label>ملف البوت</label>
        <select id="botSelector"><option value="">— اختر ملف —</option></select>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-start"   id="btnStart">▶ تشغيل</button>
      <button class="btn btn-stop"    id="btnStop">⏹ إيقاف</button>
      <button class="btn btn-restart" id="btnRestart">🔄 إعادة تشغيل</button>
      <button class="btn btn-reset"   id="btnReset">🗑 حذف الجلسة</button>
    </div>
  </div>

  <!-- رفع ملفات -->
  <div class="card">
    <div class="card-title">رفع ملفات البوت</div>
    <div id="dropZone">
      <div style="font-size:32px">📁</div>
      <p>اسحب ملف هنا أو</p>
      <label class="upload-btn">اختر ملف<input type="file" id="fileInput" multiple accept=".js,.py,.ts,.sh" hidden/></label>
      <p style="font-size:11px;margin-top:6px">.js · .py · .ts · .sh</p>
    </div>
    <div id="progWrap">
      <div id="progBar"><div id="progFill"></div></div>
      <div id="progLbl"></div>
    </div>
    <div style="margin-top:14px">
      <label style="margin-bottom:8px;display:block">الملفات المرفوعة</label>
      <div id="filesList"><p style="font-size:12px;color:var(--muted);font-style:italic">لا توجد ملفات</p></div>
    </div>
  </div>

  <!-- Terminal -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">سجل البوت الحي</div>
      <button onclick="document.getElementById('termLogs').innerHTML=''" style="font-size:11px;padding:5px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer">تنظيف</button>
    </div>
    <div id="termLogs"></div>
  </div>

</main>

<div id="toast"></div>

<script>
'use strict';
const S = { logSince: 0, pairTimer: null, pollTimer: null };

const $ = id => document.getElementById(id);

// Toast
let toastT;
function toast(msg, ok = true) {
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = ok ? 'rgba(74,222,128,.4)' : 'rgba(248,113,113,.4)';
  t.style.color = ok ? '#4ade80' : '#f87171';
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 3000);
}

// Status
const statusMeta = {
  stopped:      { txt:'متوقف',          dot:'#64748b' },
  starting:     { txt:'يبدأ…',          dot:'#fbbf24' },
  pairing:      { txt:'انتظار الربط',   dot:'#4ade80' },
  online:       { txt:'متصل ⚡',        dot:'#4ade80' },
  reconnecting: { txt:'إعادة اتصال…',   dot:'#fbbf24' },
};

function syncStatus(data) {
  const { status, pairingCode, pairingExp, bots, logs } = data;
  const meta = statusMeta[status] || statusMeta.stopped;

  $('statusTxt').textContent    = meta.txt;
  $('statusDot').style.background = meta.dot;

  // كود الربط
  const pairCard = $('pairingCard');
  if (status === 'pairing' && pairingCode) {
    pairCard.classList.add('show');
    $('pairCode').textContent = pairingCode;
    startPairTimer(pairingExp);
  } else {
    pairCard.classList.remove('show');
    clearInterval(S.pairTimer);
  }

  // ملفات
  const sel = $('botSelector');
  const prev = sel.value;
  sel.innerHTML = '<option value="">— اختر ملف —</option>';
  (bots || []).forEach(b => {
    const o = document.createElement('option');
    o.value = b.name; o.textContent = b.name;
    sel.appendChild(o);
  });
  if (prev) sel.value = prev;
  renderFiles(bots || []);

  // لوج
  if (logs && logs.length) {
    logs.forEach(l => appendLog(l.text, l.src));
    S.logSince = logs.at(-1).ts;
  }
}

function startPairTimer(exp) {
  clearInterval(S.pairTimer);
  S.pairTimer = setInterval(() => {
    const left = Math.max(0, Math.round((exp - Date.now()) / 1000));
    $('pairSec').textContent = left;
    if (left === 0) clearInterval(S.pairTimer);
  }, 1000);
}

function renderFiles(bots) {
  const el = $('filesList');
  if (!bots.length) { el.innerHTML = '<p style="font-size:12px;color:var(--muted);font-style:italic">لا توجد ملفات</p>'; return; }
  el.innerHTML = bots.map(b => `
    <div class="file-item">
      <span class="file-ext">${b.name.split('.').pop().toUpperCase()}</span>
      <span class="file-name">${b.name}</span>
      <span class="file-del" data-del="${b.name}">حذف</span>
    </div>
  `).join('');
  el.querySelectorAll('.file-del').forEach(btn =>
    btn.addEventListener('click', async () => {
      if (!confirm(`حذف "${btn.dataset.del}"؟`)) return;
      await fetch(`/api/bots/${encodeURIComponent(btn.dataset.del)}`, { method:'DELETE' });
      toast('تم الحذف');
    })
  );
}

function appendLog(text, src) {
  const el = $('termLogs');
  const d  = document.createElement('div');
  d.className = src;
  d.textContent = text;
  el.appendChild(d);
  while (el.children.length > 500) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

// Poll
async function poll() {
  try {
    const r = await fetch(`/api/state?since=${S.logSince}`);
    const d = await r.json();
    syncStatus(d);
  } catch {}
}

// API action
async function action(payload) {
  const pass = $('adminPass').value || 'amirati2026';
  try {
    const r = await fetch('/api/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pass, ...payload }),
    });
    const d = await r.json();
    if (!d.ok) toast(d.error || 'خطأ', false);
    return d;
  } catch { toast('تعذّر الاتصال', false); }
}

// Buttons
$('btnStart').onclick   = async () => { await action({ action:'start', bot: $('botSelector').value }); toast('جاري التشغيل…'); };
$('btnStop').onclick    = async () => { await action({ action:'stop'    }); toast('تم الإيقاف'); };
$('btnRestart').onclick = async () => { await action({ action:'restart' }); toast('جاري إعادة التشغيل…'); };
$('btnReset').onclick   = async () => {
  if (!confirm('حذف الجلسة؟ ستحتاج ربط جديد.')) return;
  await action({ action:'reset_session' });
  toast('تم حذف الجلسة');
};

// Upload
async function uploadFiles(files) {
  if (!files.length) return;
  const form = new FormData();
  for (const f of files) form.append('files', f);
  $('progWrap').style.display = 'block';
  $('progFill').style.width   = '30%';
  $('progLbl').textContent    = 'جاري الرفع…';
  try {
    const r = await fetch('/api/upload', { method:'POST', body: form });
    const d = await r.json();
    $('progFill').style.width = '100%';
    if (d.ok) { $('progLbl').textContent = `✓ ${d.uploaded.join(', ')}`; toast('تم الرفع ✓'); }
    else { $('progLbl').textContent = d.error; toast(d.error, false); }
  } catch { toast('فشل الرفع', false); }
  setTimeout(() => { $('progWrap').style.display='none'; $('progFill').style.width='0%'; }, 3000);
}

$('fileInput').addEventListener('change', () => { uploadFiles([...$('fileInput').files]); $('fileInput').value=''; });
const dz = $('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); uploadFiles([...e.dataTransfer.files]); });

// Init
poll();
S.pollTimer = setInterval(poll, 3000);
</script>
</body>
</html>
